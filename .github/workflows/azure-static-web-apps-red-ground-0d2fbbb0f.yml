name: Azure Static Web Apps CI/CD

on:
  push:
    branches: pull_request:
    types: branches: jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YOUR_TOKEN_HERE }}  # <-- keep your token line
          repo_token: ${{ secrets.GITHUB_TOKEN }}  # <-- keep this too
          action: "upload"
          app_location: "/"       # root folder
          api_location: ""        # no API yet
          output_location: ""     # no build output
          skip_app_build: true    # <-- this skips Oryx/Node entirely!