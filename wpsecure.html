<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WPSecure</title>
  <!-- Office.js CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <!-- MSAL.js (browser) for NAA -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.14.1/lib/msal-browser.min.js" integrity="sha384-yO2dB0xJjH5mW0+u1dW1k9rw8YwQ3lgm1w5q+J1Q1y6b8LhVvQW2Sxv9xKp5bJrN" crossorigin="anonymous"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 16px; }
    .container { max-width: 560px; }
    .btn { background:#0078d4; color:#fff; border:none; padding:8px 14px; border-radius:4px; cursor:pointer; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .muted { color:#666; font-size:12px; }
    pre { background:#f6f6f6; padding:8px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h3>WPSecure</h3>
    <p class="muted">This pane is optional. Use the <b>WPSecure</b> ribbon button to re-insert the signature on demand.</p>
    <button id="reinjectionBtn" class="btn">Re-insert Signature</button>
    <pre id="status" class="muted"></pre>
  </div>
  <script src="./wpsecure.js"></script>
  <script>
    // Wire the in-pane button to the same command function for convenience.
    document.getElementById('reinjectionBtn').addEventListener('click', async () => {
      try { await window.WPSecure_Reinsert_Action({ fromPane: true }); }
      catch(e) { console.error(e); }
    });
  </script>
</body>
</html>
